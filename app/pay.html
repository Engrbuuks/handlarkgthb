<!DOCTYPE html>
<html lang="en" data-demo-page="pay">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Demo checkout</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#F7F4F8;--card:#FFFFFF;--ink:#25173B;--muted:#5E5270;--line:#E6DEEC;--plum:#2E1C47;--coral:#FF7059;--blush:#FFE7E1;--ok:#1F7A55;--err:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#150D20;--card:#22162F;--ink:#F3ECF8;--muted:#C5B8D3;--line:#3A2A4D;--plum:#E9DEF8;--blush:#3A2230;--ok:#7FD8AE;--err:#FFB4AB}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.demo{background:var(--coral);color:#2E1C47;font-weight:800;border-radius:12px;padding:10px 14px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0}
.muted{color:var(--muted);font-size:14px;margin:0}
.amount{font-size:30px;font-weight:800;margin:0}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row{display:flex;gap:10px}.row label{flex:1;min-width:0}input{width:100%;min-width:0}
button{font:700 16px Manrope,"Segoe UI",system-ui,sans-serif;border:0;border-radius:12px;background:var(--coral);color:#2E1C47;padding:13px 18px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
a{color:var(--plum);font-weight:700}
.acct{background:var(--bg);color:var(--ink);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:2px;font-weight:700}.acct small{font-weight:500;color:var(--muted);font-size:13px}.acct:hover{border-color:var(--coral)}
.ok{color:var(--ok);font-weight:700;margin:0}.err{color:var(--err);font-weight:700;margin:0}
:focus-visible{outline:3px solid #E85A44;outline-offset:2px}
</style>
</head>
<body>
<main id="pay" aria-live="polite"><p class="muted">Loading the demo checkout…</p></main>
<script src="demo.js"></script>
<script src="demo_pay.js"></script>
</body>
</html>
