<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Handlark setup keys</title>
<style>
:root{--bg:#F2F5F6;--card:#fff;--ink:#1F3B47;--muted:#6B7C85;--teal:#234F5F;--orange:#F4A640;--line:#E4EAED}
@media (prefers-color-scheme:dark){:root{--bg:#0F1F26;--card:#16303A;--ink:#EAF2F5;--muted:#93A9B2;--teal:#9FC6D3;--line:#25444F}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Poppins,"Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 16px}
h1{font-size:24px;color:var(--teal);margin:0 0 8px}
p{color:var(--muted);margin:0 0 16px}
.k{background:var(--card);border-radius:16px;padding:14px 16px;margin:0 0 12px;display:flex;flex-direction:column;gap:6px}
.k b{font-size:13px;letter-spacing:.04em}
.k code{font:13px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--bg);border-radius:8px;padding:8px 10px;user-select:all}
button{border:0;border-radius:12px;background:var(--orange);color:#fff;font:600 14px inherit;padding:10px 18px;cursor:pointer;align-self:flex-start}
button.ghost{background:none;border:1.5px solid var(--line);color:var(--teal)}
</style>
</head>
<body>
<main>
  <h1>Setup keys</h1>
  <p>These are made here in your browser and are not sent anywhere. Copy each one into Supabase: Edge Functions, Secrets. Then close this page. Making new ones later turns off phone alerts on every device until people switch them on again, and signs everyone out of two step sign in once.</p>
  <div id="out"></div>
  <button type="button" id="again" class="ghost">Make new keys</button>
</main>
<script>
(function(){
  var b64u=function(u8){var s='';new Uint8Array(u8).forEach(function(b){s+=String.fromCharCode(b);});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
  function row(name,val,note){var d=document.createElement('div');d.className='k';
    d.innerHTML='<b></b><code></code><small style="color:var(--muted)"></small><button type="button" class="ghost">Copy</button>';
    d.querySelector('b').textContent=name;d.querySelector('code').textContent=val;d.querySelector('small').textContent=note;
    d.querySelector('button').onclick=function(){var btn=this;(navigator.clipboard?navigator.clipboard.writeText(val):Promise.reject()).then(function(){btn.textContent='Copied';},function(){btn.textContent='Select the text and copy it';});};
    return d;}
  function make(){var out=document.getElementById('out');out.textContent='Making keys…';
    crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']).then(function(kp){
      return Promise.all([crypto.subtle.exportKey('raw',kp.publicKey),crypto.subtle.exportKey('jwk',kp.privateKey)]);}).then(function(k){
      out.textContent='';
      out.appendChild(row('VAPID_PUBLIC_KEY',b64u(k[0]),'For phone alerts. This half is public.'));
      out.appendChild(row('VAPID_PRIVATE_KEY',k[1].d,'For phone alerts. Keep it secret.'));
      out.appendChild(row('SESSION_SECRET',b64u(crypto.getRandomValues(new Uint8Array(32))),'Switches on two step sign in. Keep it secret.'));
    }).catch(function(e){out.textContent='This browser could not make keys: '+e.message+'. Try Chrome, Edge or Safari.';});}
  document.getElementById('again').onclick=make;make();
})();
</script>
</body>
</html>
